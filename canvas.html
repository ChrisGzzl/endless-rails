  <style>
    /* Deliberately minimal: this page is the DOM-free boot path. The only
       DOM the game may touch is the canvas element passed to the host. */
    html, body { margin: 0; padding: 0; height: 100%; background: #0c181f; overflow: hidden; }
    body { display: grid; place-items: stretch; }
    #gameCanvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    // Hand the canvas to the host before the module graph evaluates; the
    // mini-game adapter performs the same step against wx.createCanvas().
    // The canvas fills the viewport: the HUD draws in viewport CSS pixels,
    // exactly like the DOM version's responsive layout.
    const canvas = document.getElementById("gameCanvas");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    globalThis.__endlessRailsCanvas = canvas;
  </script>
  <script type="module" src="src/entry/canvas-main.js?v=v0.10.3.2"></script>
</body>
